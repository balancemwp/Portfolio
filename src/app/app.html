<header class="site-header">
  <nav class="nav shell" aria-label="Primary navigation">
    <a class="wordmark" href="#top" aria-label="Martin Porter home">
      <span class="wordmark-mark">MP</span>
      <span>Martin Porter</span>
    </a>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#expertise">Expertise</a>
      <a href="#work">Selected work</a>
      <a href="#experience">Experience</a>
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isLightMode ? 'Switch to dark mode' : 'Switch to light mode'"
      >
        <span aria-hidden="true">{{ isLightMode ? '☾' : '☼' }}</span>
        {{ isLightMode ? 'Dark' : 'Light' }}
      </button>
      <a class="nav-cta" href="#contact">Let's talk <span aria-hidden="true">↗</span></a>
    </div>
  </nav>
</header>

<main id="top">

  <app-hero></app-hero>

  <app-proof-strip></app-proof-strip>

  <app-about></app-about>

  <app-expertise></app-expertise>

  <app-work></app-work>

  <app-experience></app-experience>

  <app-leadership></app-leadership>

  <app-contact></app-contact>
  
</main>

<app-footer></app-footer>
